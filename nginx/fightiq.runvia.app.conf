# Fight IQ — host nginx (HTTP vhost).
# *.runvia.app 의 HTTPS 는 /etc/nginx/conf.d/runvia-wildcard-ssl.conf 가 받아 원래 Host 그대로 :80 으로 넘긴다.
# deploy.sh --nginx (또는 --nginx-only) 가 /etc/nginx/sites-available 에 설치한다 — 이 파일을 고칠 것.
server {
  listen 80;
  listen [::]:80;
  server_name fightiq.runvia.app;

  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:__APP_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
